# Halal Motion configuration
funds: [spus, mnzl]            # universe source(s): union of the SPUS and MNZL halal ETFs
start_backtest: "2020-01-01"   # first month traded
# Extra history before the first traded month. The hand-written signals only
# need ~13 months for a 12-1 lookback; the learned signals (src/halalmo/ml.py)
# additionally need 18 months of *realized* forward returns before their first
# fit is trusted, so this reaches back further to keep them out of warm-up
# fallback for the whole backtest.
price_history_start: "2016-01-01"
cost_bps_per_side: 10          # transaction cost assumption, basis points per side
atr_multiple: 3.0              # raw stop distance (x ATR-22) before the % band clamps it
benchmarks: [SPY, QQQ, "^DJI"]  # SPY/QQQ: dividend-adjusted ETFs; ^DJI: Dow price index

# Three sleeves, ordered from most to least risk. stop_min_pct/stop_max_pct clamp
# every trailing stop into a sane band (never wider than 15%).
tracks:
  aggressive:
    n: 8
    weighting: inv_vol
    stop_min_pct: 0.10
    stop_max_pct: 0.15
    label: "Aggressive — top 8, concentrated"
    blurb: "The eight strongest trends in the halal universe, sized by inverse volatility. No sector limits, widest stops. Highest expected return and the hardest drawdowns."
  balanced:
    n: 20
    weighting: inv_vol
    max_per_sector: 3
    stop_min_pct: 0.08
    stop_max_pct: 0.12
    label: "Balanced — top 20, sector-capped"
    blurb: "Twenty names with no more than three from any one sector, so the sleeve can't quietly become an all-tech bet. Middle-of-the-road stops."
  conservative:
    n: 25
    weighting: inv_vol
    max_per_sector: 3
    vol_screen_pct: 0.5        # only the calmest half of the universe is eligible
    require_positive: true     # negative-momentum slots stay in cash
    stop_min_pct: 0.05
    stop_max_pct: 0.08
    label: "Conservative — top 25, low-volatility, sector-capped"
    blurb: "Ranks only the calmest half of the universe, caps each sector at three names, holds cash rather than forcing picks when momentum is negative, and runs the tightest stops."

# GICS sub-industries excluded regardless of the Musaffa ratio verdict — catches
# business lines (routine alcohol/gambling exposure, conventional insurance)
# that a pure financial-ratio screen doesn't always flag. Sub-industry comes
# from Musaffa's own reported GICS classification. excluded_tickers is for
# one-off overrides not caught by the sub-industry list.
business_activity_screen:
  excluded_subindustries:
    - "Hotels, Resorts & Cruise Lines"    # routine onboard alcohol/casino revenue
    - "Casinos & Gaming"
    - "Life & Health Insurance"           # conventional (non-takaful) insurance
    - "Multi-line Insurance"
    - "Property & Casualty Insurance"
    - "Reinsurance"
    - "Insurance Brokers"
  excluded_tickers: []

# A small, explicitly-sourced, editable list of publicly documented boycott
# targets — NOT a comprehensive database. No clean machine-readable BDS/boycott
# API exists (unlike Musaffa's compliance data); this is a starting point you
# extend by hand as you become aware of specific, well-documented cases. Every
# entry should cite where the claim comes from. Set enabled: false to turn off.
bds_screen:
  enabled: true
  excluded_tickers:
    - ticker: SBUX
      exchange: NASDAQ
      reason: "Widely reported consumer boycott target since late 2023, tied to Starbucks Workers United's Palestine solidarity statement and the company's response to it."
      source: "https://time.com/6694986/israel-palestine-bds-boycotts-starbucks-mcdonalds/"

selector:
  window_months: 24     # trailing evaluation window
  min_months: 12        # months of history before adaptive selection kicks in
  switch_margin: 0.25   # challenger must beat incumbent Sortino by this to take over
  default_variant: "mom_12_1"   # literature-standard default during warm-up

site_title: "Halal Motion"
